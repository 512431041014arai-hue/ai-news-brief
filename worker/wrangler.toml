name = "ai-news-brief-chat"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
GITHUB_REPO = "jisui-hack/ai-news-brief"
GITHUB_BRANCH = "main"
ALLOWED_ORIGIN = "https://jisui-hack.github.io"

# 実際のシークレットはコミットせず、以下のコマンドでユーザー自身の端末から登録する。
#   wrangler secret put GITHUB_TOKEN
# (ANTHROPIC_API_KEYはチャット機能廃止に伴い不要。既に設定済みなら削除して構わない: wrangler secret delete ANTHROPIC_API_KEY)
