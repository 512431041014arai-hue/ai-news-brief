name: AI News Brief

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Claudeでニュースブリーフを生成
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはaraiさん専属のニュースアナリストです。araiさんはAI業界への転職・キャリアアップを目指しており、毎朝マクロ経済とAI業界動向を手軽にキャッチアップしたいと考えています。以下を実行してください。

            # 手順
            0. 学習ループ：リポジトリに `chats/` ディレクトリがあれば、その配下の `*.md` ファイル（スマホサイトでのチャット履歴ログ）を確認する。`preferences.md` の「4. 学習ログ」表にまだ記録されていない（ファイル名や日付が表に無い）ものだけを対象に、次を行う：
               - 各ログの質問内容・関心の方向性を読み取り、「4. 学習ログ」表に1行ずつ追記する（日付／アクション＝「チャットで深掘り」／テーマ・記事／今後の選定への反映、の形式）。
               - ログのfrontmatterや本文に `feedback: exclude` や「もう出さないでください」等の明示的な除外意思が含まれる場合は、「3. 除外・関心が薄いテーマ」にそのテーマを追記する。
               - 複数のログで同じテーマへの質問が繰り返されている場合は、「1. お気に入りテーマ」の該当行の優先度を1段階上げる（★☆☆→★★☆→★★★、既に★★★なら据え置き）。
               - 変更後の `preferences.md` を保存する。処理対象のログが無ければこの手順はスキップしてよい。
            1. リポジトリ直下の `preferences.md` を読み、お気に入りテーマ・信頼ソース・除外テーマを把握する（手順0で更新した場合はその内容を反映する）。読めない場合は「AI業界動向・日本のAI企業・マクロ経済・AI求人トレンド」を優先テーマとする。
            2. 日付は日本時間で扱う。`TZ=Asia/Tokyo date +%Y-%m-%d` を実行して今日の日付（YYYY-MM-DD）を取得する。
            3. WebSearchで直近およそ24時間の以下のニュースを集める（preferences.mdの優先度・信頼ソースに従う。日本市場中心＋重要なグローバルは補足）：
               - AI業界動向（主要AI企業、モデルリリース、資金調達、M&A、日本のAIスタートアップ）
               - マクロ経済（日銀・金利・為替・株価・雇用統計など）
               - AI関連の求人・スキル・注目職種・採用トレンド
               信頼性が低い/裏取りできない情報は載せない。各ニュースは背景まで理解できるよう十分に調べる。除外テーマに該当するものは選ばない。

            4. 10〜15本の見出しを選び、`briefs/<YYYY-MM-DD>.md` を新規作成する。冒頭に必ず次のfrontmatterを付ける：
               ---
               created: <YYYY-MM-DD> 08:00
               category: 29_AI業界ニュース
               tags:
                - 5_リファレンス/AI業界ニュース
                - AIニュースBrief/デイリー
               ---
               本文は【AI業界】【マクロ経済・日本市場】【AI求人・スキル】の3セクションに分け、各見出しは「番号. <見出し> — <1〜2文の要約>（出典・リンク）」形式。転職準備の視点で特に重要なものには「★注目」を付ける。

            5. `docs/data/<YYYY-MM-DD>.json` を新規作成する（このファイルがスマホサイトの表示データになる。`docs/index.html` 自体は固定のテンプレートなので絶対に編集・上書きしないこと）。スキーマ：
               ```json
               {
                 "date": "<YYYY-MM-DD>",
                 "sections": [
                   {
                     "title": "AI業界",
                     "articles": [
                       {
                         "id": "<YYYY-MM-DD>-ai-1",
                         "star": true,
                         "headline": "見出し",
                         "summary": "1〜2文の短い要約（一覧のプレビュー用）",
                         "detail": "2〜4文の詳しい解説（背景・論点、タップで開いたときに表示）",
                         "careerNote": "転職視点の一言（1〜2文）",
                         "sourceLabel": "出典名（例: 日本経済新聞）",
                         "sourceUrl": "https://..."
                       }
                     ]
                   }
                 ]
               }
               ```
               - `sections` は【AI業界】【マクロ経済・日本市場】【AI求人・スキル】の3つ、`id` は各セクションごとに連番（例: `ai-1`, `macro-1`, `job-1`）を日付でprefixする。`star` は特に重要な見出しのみ `true`。
               - あわせて `docs/data/index.json` を更新する。既存の `{"dates": [...]}` を読み込み、今日の日付を配列の**先頭**に追加する（重複があれば追加しない）。日付は新しい順。

            6. `briefs/latest-notify.txt` を生成（上書き）する。Telegram通知用のプレーンテキスト、3500文字以内。内容：1行目に日付、続けて各見出しを「番号. 見出し（ごく短い一言）」で列挙。最終行に必ず次を入れる：
               ▼タップして詳細を読む: https://512431041014arai-hue.github.io/ai-news-brief/
               Markdown記法や絵文字は使わない。

            7. 生成物（briefs/、docs/data/、preferences.md）はワークスペースに書き込むだけでよい（gitコミットは後続ステップが行う）。`docs/index.html` には触れないこと。

            簡潔かつ丁寧な日本語で。araiさんの好みは「余計な説明を省き、要点を的確に」。

          claude_args: |
            --allowedTools WebSearch,WebFetch,Read,Write,Edit,Bash
            --max-turns 50
            --model claude-sonnet-5

      - name: 生成物をコミット
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AI News Brief $(TZ=Asia/Tokyo date +%Y-%m-%d)" || echo "変更なし"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Telegramで通知
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -f briefs/latest-notify.txt || exit 0
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text@briefs/latest-notify.txt" -d "disable_web_page_preview=true"
