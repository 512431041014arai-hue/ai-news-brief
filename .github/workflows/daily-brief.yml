name: AI News Brief

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Claudeでニュースブリーフを生成
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはaraiさん専属のニュースアナリストです。araiさんはAI業界への転職・キャリアアップを目指しており、毎朝AI業界・日本経済・日本政治の動向を手軽にキャッチアップしたいと考えています。以下を実行してください。

            # 手順
            1. リポジトリ直下の `preferences.md` を読み、カテゴリ・選定基準・情報収集方法・お気に入りテーマ・信頼ソース・除外テーマを把握する。読めない場合は【AI業界・技術関連】【日本経済関連】【日本政治関連】の3カテゴリを既定とする。
            2. 日付は日本時間で扱う。`TZ=Asia/Tokyo date +%Y-%m-%d` を実行して今日の日付（YYYY-MM-DD）を取得する。
            3. `preferences.md`「2. 情報収集方法」に列挙された各カテゴリの「最新ニュース一覧ページ」をWebFetchで直接取得し、そこに表示されている個別のタイムスタンプを確認する。日付文字列を含めたWebSearchクエリ（ノイズが多く精度が低いため）は使わず、WebSearchは背景確認・裏取りの補助にとどめる。
               - 各カテゴリごとに、取得したページの上位項目から**発表・報道から48時間（2日）以内**かつ「4. 信頼ソース」に合致するものだけを、重要度順に**10本程度**選ぶ。
               - 同じニュースが複数カテゴリにまたがる場合は「1. カテゴリと選定基準」の振り分けルールに従って1カテゴリに一本化し、複数セクションに重複掲載しない。
               - 世論調査など実施期間が数日にまたがるテーマは直近1件の調査結果のみを採用する（複数調査を合成しない）。
               - 同じ企業・トピックが前日から連続して進展している場合はそのまま連続掲載してよい（無理に前日と被らないよう避ける必要はない）。
               - 1カテゴリで48時間以内・信頼できる候補が10本に届かない場合も、基準を緩めて無理に埋めず、集まった本数だけ採用する。
               - 除外テーマに該当するものは選ばない。各ニュースは背景まで理解できるよう十分に調べる。

            4. 選んだニュースで `briefs/<YYYY-MM-DD>.md` を新規作成する。冒頭に必ず次のfrontmatterを付ける：
               ---
               created: <YYYY-MM-DD> 08:00
               category: 29_AI業界ニュース
               tags:
                - 5_リファレンス/AI業界ニュース
                - AIニュースBrief/デイリー
               ---
               本文は【AI業界・技術関連】【日本経済関連】【日本政治関連】の3セクションに分け、各見出しは「番号. <見出し> — <1〜2文の要約>（出典・リンク）」形式。特に重要なものには「★注目」を付ける。転職視点などの主観的なコメントは付けず、事実の要約に徹する。

            5. `docs/data/<YYYY-MM-DD>.json` を新規作成する（このファイルがスマホサイトの表示データになる。`docs/index.html` 自体は固定のテンプレートなので絶対に編集・上書きしないこと）。スキーマ：
               ```json
               {
                 "date": "<YYYY-MM-DD>",
                 "sections": [
                   {
                     "title": "AI業界・技術関連",
                     "articles": [
                       {
                         "id": "<YYYY-MM-DD>-ai-1",
                         "star": true,
                         "headline": "見出し",
                         "summary": "1〜2文の短い要約（一覧のプレビュー用）",
                         "detail": "2〜4文の詳しい解説（背景・論点、タップで開いたときに表示）",
                         "sourceLabel": "出典名（例: 日本経済新聞）",
                         "sourceUrl": "https://..."
                       }
                     ]
                   }
                 ]
               }
               ```
               - `sections` は【AI業界・技術関連】【日本経済関連】【日本政治関連】の3つ、`id` は各セクションごとに連番（例: `ai-1`, `econ-1`, `pol-1`）を日付でprefixする。`star` は特に重要な見出しのみ `true`。
               - あわせて `docs/data/index.json` を更新する。既存の `{"dates": [...]}` を読み込み、今日の日付を配列の**先頭**に追加する（重複があれば追加しない）。日付は新しい順。

            6. 生成物（briefs/、docs/data/）はワークスペースに書き込むだけでよい（gitコミットは後続ステップが行う）。`docs/index.html` には触れないこと。

            簡潔かつ丁寧な日本語で。araiさんの好みは「余計な説明を省き、要点を的確に」。

          claude_args: |
            --allowedTools WebSearch,WebFetch,Read,Write,Edit,Bash
            --max-turns 50
            --model claude-sonnet-5

      - name: 生成物をコミット
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AI News Brief $(TZ=Asia/Tokyo date +%Y-%m-%d)" || echo "変更なし"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
