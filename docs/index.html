<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIニュースBrief</title>
<meta name="theme-color" content="#2260d6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIニュース">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --sub: #6b6b70;
    --card-bg: #f6f6f8;
    --border: #e2e2e6;
    --accent: #2260d6;
    --accent-fg: #ffffff;
    --star: #d97706;
    --heart: #c1394a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #f0f0f2;
      --sub: #a3a3aa;
      --card-bg: #1e1e21;
      --border: #303034;
      --accent: #7aa7ff;
      --accent-fg: #0b1220;
      --star: #f5a524;
      --heart: #ff8a9a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 60px;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    line-height: 1.8;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; }
  main, #app-header {
    max-width: 640px;
    margin: 0 auto;
  }
  header.top {
    max-width: 640px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  header.top h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: 0.02em;
    text-align: center;
  }
  #settingsBtn {
    position: absolute;
    right: 0;
    top: -4px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--sub);
    cursor: pointer;
    padding: 6px;
  }
  #favoritesBtn {
    position: absolute;
    left: 0;
    top: -4px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--sub);
    cursor: pointer;
    padding: 6px;
  }
  .datebar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .datebar button {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .datebar button:disabled { opacity: 0.35; cursor: default; }
  .datebar select {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.95rem;
  }
  h2 {
    font-size: 1.15rem;
    margin: 32px 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  summary {
    padding: 14px 16px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: "▾";
    margin-left: auto;
    color: var(--sub);
    font-weight: normal;
    flex-shrink: 0;
  }
  details[open] > summary::after { content: "▴"; }
  details[open] > summary {
    border-bottom: 1px solid var(--border);
  }
  .star { color: var(--star); }
  .fav-btn {
    background: none;
    border: none;
    font-size: 1.15rem;
    line-height: 1;
    padding: 0 2px 0 0;
    cursor: pointer;
    color: var(--heart);
    flex-shrink: 0;
  }
  .fav-card { padding: 14px 16px; }
  .fav-meta { font-size: 0.78rem; color: var(--sub); margin-bottom: 4px; }
  .fav-headline { font-weight: 600; margin-bottom: 6px; }
  .fav-summary { font-size: 0.9rem; margin: 0 0 8px; }
  .body { padding: 14px 16px 16px; font-size: 0.95rem; }
  .body p { margin: 0 0 10px; }
  .actions-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .actions-row a.source-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.85rem;
    margin-right: auto;
  }
  .actions-row a.source-link:hover { text-decoration: underline; }
  .action-btn {
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .action-btn.primary { background: var(--accent); color: var(--accent-fg); }
  .action-btn.secondary { background: var(--bg); color: var(--fg); border: 1px solid var(--border); }
  footer.page-footer {
    max-width: 640px;
    margin: 40px auto 0;
    text-align: center;
    color: var(--sub);
    font-size: 0.8rem;
  }
  .empty-state {
    text-align: center;
    color: var(--sub);
    padding: 60px 20px;
  }

  /* overlay / bottom sheet (設定パネルで使用) */
  .overlay {
    position: fixed;
    left: 0;
    right: 0;
    top: var(--vv-top, 0px);
    height: var(--vv-height, 100vh);
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: flex-end;
    z-index: 50;
  }
  .overlay.hidden { display: none; }
  .sheet {
    background: var(--bg);
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    border-radius: 16px 16px 0 0;
    max-height: calc(var(--vv-height, 100vh) * 0.88);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
  }
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-title { font-weight: 700; font-size: 1rem; padding-right: 12px; }
  .sheet-header button.close {
    background: none;
    border: none;
    color: var(--sub);
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* settings */
  .settings-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .settings-body label { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--sub); }
  .settings-body input {
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  .settings-body .save-btn {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .settings-note { font-size: 0.78rem; color: var(--sub); line-height: 1.6; }
</style>
</head>
<body>
<header class="top">
  <button id="favoritesBtn" aria-label="お気に入り一覧">★</button>
  <h1>AIニュースBrief</h1>
  <button id="settingsBtn" aria-label="設定">⚙️</button>
</header>

<div class="datebar" id="datebar">
  <button id="prevDay" aria-label="前の日">◀</button>
  <select id="dateSelect"></select>
  <button id="nextDay" aria-label="次の日">▶</button>
</div>

<main id="content">
  <div class="empty-state">読み込み中…</div>
</main>

<footer class="page-footer">AIニュースBrief — araiさん専属ダイジェスト</footer>

<!-- 設定シート -->
<div id="settingsOverlay" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title">設定</div>
      <button class="close" id="settingsClose" aria-label="閉じる">✕</button>
    </div>
    <div class="settings-body">
      <label>Obsidian Vault名
        <input id="cfgVault" placeholder="例: Obsidian" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <label>保存先フォルダ（Vault内のパス）
        <input id="cfgFolder" placeholder="99_情報ソース/AIニュースBrief" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <button class="save-btn" id="settingsSave">保存</button>
      <div class="settings-note">
        Vault名はObsidianアプリに表示されている名前と一致させてください。設定はこの端末のブラウザにのみ保存されます。
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var WORKER_BASE = 'https://ai-news-brief-chat.ainewsbrief.workers.dev';

  var state = {
    dates: [],
    currentDate: null,
    data: null,
    favorites: {},
    view: 'daily'
  };

  var contentEl = document.getElementById('content');
  var dateSelect = document.getElementById('dateSelect');
  var prevDayBtn = document.getElementById('prevDay');
  var nextDayBtn = document.getElementById('nextDay');

  // iOSのソフトウェアキーボード表示時、position:fixedの要素がキーボードの下に
  // 隠れて入力欄が届かなくなる問題への対策。visualViewportの高さ・オフセットを
  // CSSカスタムプロパティに反映し、オーバーレイの高さをそれに追従させる。
  function syncViewportVars() {
    var vv = window.visualViewport;
    var height = vv ? vv.height : window.innerHeight;
    var top = vv ? vv.offsetTop : 0;
    document.documentElement.style.setProperty('--vv-height', height + 'px');
    document.documentElement.style.setProperty('--vv-top', top + 'px');
  }
  syncViewportVars();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewportVars);
    window.visualViewport.addEventListener('scroll', syncViewportVars);
  }
  window.addEventListener('orientationchange', function () {
    setTimeout(syncViewportVars, 250);
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatDateJp(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if (!m) return d;
    return m[1] + '年' + parseInt(m[2], 10) + '月' + parseInt(m[3], 10) + '日';
  }

  // ---------- settings ----------
  var SETTINGS_KEY = 'ainewsbrief.settings.v1';
  var DEFAULT_FOLDER = '99_情報ソース/AIニュースBrief';

  function loadSettings() {
    try {
      return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
    } catch (e) { return {}; }
  }
  function saveSettings(s) {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
  }

  var settingsOverlay = document.getElementById('settingsOverlay');
  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('settingsClose').addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', function (e) { if (e.target === settingsOverlay) closeSettings(); });
  document.getElementById('settingsSave').addEventListener('click', function () {
    var s = {
      vault: document.getElementById('cfgVault').value.trim(),
      folder: document.getElementById('cfgFolder').value.trim()
    };
    saveSettings(s);
    closeSettings();
  });

  function openSettings() {
    var s = loadSettings();
    document.getElementById('cfgVault').value = s.vault || '';
    document.getElementById('cfgFolder').value = s.folder || DEFAULT_FOLDER;
    settingsOverlay.classList.remove('hidden');
  }
  function closeSettings() { settingsOverlay.classList.add('hidden'); }

  // ---------- 「AIに聞いてみる」: ニュースの文脈を持たせてChromeでClaudeを開く ----------
  function buildClaudePrompt(article) {
    var lines = [];
    lines.push('次のニュース記事について教えてください。');
    lines.push('');
    lines.push('見出し: ' + article.headline);
    if (article.summary) lines.push('要約: ' + article.summary);
    if (article.detail) lines.push('詳細: ' + article.detail);
    if (article.sourceUrl) lines.push('出典: ' + article.sourceUrl);
    return lines.join('\n');
  }

  // Chromeのカスタムスキームで開き、Chromeが無ければ通常のhttpsリンクにフォールバックする
  function openPreferChrome(httpsUrl) {
    var chromeUrl = httpsUrl.replace(/^https:\/\//, 'googlechromes://').replace(/^http:\/\//, 'googlechrome://');
    var timer = setTimeout(function () {
      window.location.href = httpsUrl;
    }, 900);
    function onVisibilityChange() {
      if (document.hidden) {
        clearTimeout(timer);
        document.removeEventListener('visibilitychange', onVisibilityChange);
      }
    }
    document.addEventListener('visibilitychange', onVisibilityChange);
    window.location.href = chromeUrl;
  }

  function askClaude(article) {
    var prompt = buildClaudePrompt(article);
    // URLでの引き渡しが効かない場合に備えて、クリップボードにもコピーしておく
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(prompt).catch(function () {});
    }
    var claudeUrl = 'https://claude.ai/new?q=' + encodeURIComponent(prompt);
    // claude.aiへ直接遷移するとiOSのUniversal LinksでClaudeアプリに
    // 自動的に持っていかれることがあるため、一度自ドメイン(Worker)を
    // 経由してから302でclaude.aiへリダイレクトする。
    var bounceUrl = WORKER_BASE + '/goto?u=' + encodeURIComponent(claudeUrl);
    openPreferChrome(bounceUrl);
  }

  // ---------- お気に入り ----------
  function loadFavoritesIndex() {
    return fetch('data/favorites.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('status ' + res.status); return res.json(); })
      .then(function (data) {
        var map = {};
        (data.favorites || []).forEach(function (it) { map[it.articleId] = it; });
        state.favorites = map;
      })
      .catch(function () { state.favorites = {}; });
  }

  function toggleFavorite(article, category, date, btnEl) {
    var willAdd = !state.favorites[article.id];
    var record = {
      date: date || state.currentDate,
      articleId: article.id,
      headline: article.headline,
      summary: article.summary,
      category: category,
      sourceLabel: article.sourceLabel,
      sourceUrl: article.sourceUrl,
      favoritedAt: new Date().toISOString()
    };
    if (willAdd) state.favorites[article.id] = record;
    else delete state.favorites[article.id];
    if (btnEl) btnEl.textContent = willAdd ? '♥' : '♡';

    fetch(WORKER_BASE + '/api/favorite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: willAdd ? 'add' : 'remove',
        date: record.date,
        articleId: record.articleId,
        headline: record.headline,
        summary: record.summary,
        category: record.category,
        sourceLabel: record.sourceLabel,
        sourceUrl: record.sourceUrl
      })
    }).catch(function (e) { console.warn('favorite sync failed', e); });
  }

  // ---------- Obsidianに保存 ----------
  function sanitizeFilename(s) {
    return String(s).replace(/[\\/:*?"<>|#^\[\]]/g, '').trim().slice(0, 60);
  }

  function saveArticleToObsidian(article) {
    var s = loadSettings();
    if (!s.vault) { alert('先に設定でObsidianのVault名を入力してください。'); openSettings(); return; }

    var folder = (s.folder || DEFAULT_FOLDER).replace(/\/+$/, '');
    var filename = folder + '/' + state.currentDate + '_' + sanitizeFilename(article.headline) + '.md';

    var lines = [];
    lines.push('---');
    lines.push('created: ' + state.currentDate);
    lines.push('tags:');
    lines.push(' - AIニュースBrief');
    lines.push('---');
    lines.push('');
    lines.push('# ' + article.headline);
    lines.push('');
    if (article.summary) { lines.push('> ' + article.summary); lines.push(''); }
    if (article.detail) { lines.push(article.detail); lines.push(''); }
    if (article.sourceUrl) {
      lines.push('出典: [' + (article.sourceLabel || 'リンク') + '](' + article.sourceUrl + ')');
      lines.push('');
    }
    lines.push('## Claudeとの会話');
    lines.push('');
    lines.push('（Chromeで開いたClaudeとの会話をここに貼り付けてください）');
    lines.push('');
    var content = lines.join('\n');

    var uri = 'obsidian://new?vault=' + encodeURIComponent(s.vault) +
      '&file=' + encodeURIComponent(filename) +
      '&content=' + encodeURIComponent(content);
    window.location.href = uri;
  }

  // ---------- rendering ----------
  function renderArticle(a, category) {
    var det = document.createElement('details');
    det.className = 'card';
    det.id = 'article-' + a.id;

    var isFav = !!state.favorites[a.id];
    var sum = document.createElement('summary');
    sum.innerHTML = '<button type="button" class="fav-btn" aria-label="お気に入り">' + (isFav ? '♥' : '♡') + '</button>' +
      (a.star ? '<span class="star">★</span>' : '') + escapeHtml(a.headline);
    det.appendChild(sum);

    sum.querySelector('.fav-btn').addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      toggleFavorite(a, category, state.currentDate, e.currentTarget);
    });

    var body = document.createElement('div');
    body.className = 'body';
    var html = '<p>' + escapeHtml(a.detail || a.summary) + '</p>';
    html += '<div class="actions-row">';
    if (a.sourceUrl) {
      html += '<a class="source-link" href="' + escapeHtml(a.sourceUrl) + '" target="_blank" rel="noopener">出典: ' + escapeHtml(a.sourceLabel || 'リンク') + '</a>';
    } else {
      html += '<span class="source-link"></span>';
    }
    html += '<button class="action-btn primary" data-action="ask">🤖 AIに聞いてみる</button>';
    html += '<button class="action-btn secondary" data-action="save">📓 Obsidianに保存</button>';
    html += '</div>';
    body.innerHTML = html;
    det.appendChild(body);

    body.querySelector('[data-action="ask"]').addEventListener('click', function () {
      askClaude(a);
    });
    body.querySelector('[data-action="save"]').addEventListener('click', function () {
      saveArticleToObsidian(a);
    });

    return det;
  }

  function renderData(data) {
    contentEl.innerHTML = '';
    if (!data || !data.sections || !data.sections.length) {
      contentEl.innerHTML = '<div class="empty-state">この日のニュースはありません。</div>';
      return;
    }
    data.sections.forEach(function (section) {
      var h2 = document.createElement('h2');
      h2.textContent = section.title;
      contentEl.appendChild(h2);
      (section.articles || []).forEach(function (a) {
        contentEl.appendChild(renderArticle(a, section.title));
      });
    });
  }

  // ---------- お気に入り一覧ビュー ----------
  function renderFavoritesView() {
    contentEl.innerHTML = '<div class="empty-state">読み込み中…</div>';
    fetch('data/favorites.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var items = Array.isArray(data.favorites) ? data.favorites : [];
        var cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
        items = items.filter(function (it) {
          var t = Date.parse(it.favoritedAt || it.date);
          return isNaN(t) ? true : t >= cutoff;
        });
        renderFavoritesList(items);
      })
      .catch(function (err) {
        contentEl.innerHTML = '<div class="empty-state">お気に入りを読み込めませんでした。<br>(' + escapeHtml(err.message) + ')</div>';
      });
  }

  function renderFavoritesList(items) {
    contentEl.innerHTML = '';
    var h2 = document.createElement('h2');
    h2.textContent = '★ お気に入り（直近30日）';
    contentEl.appendChild(h2);

    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'お気に入りはまだありません。記事の♡をタップして追加できます。';
      contentEl.appendChild(empty);
      return;
    }

    items.forEach(function (it) {
      var card = document.createElement('div');
      card.className = 'card fav-card';
      var html = '<div class="fav-meta">' + escapeHtml(formatDateJp(it.date)) + (it.category ? ' ・ ' + escapeHtml(it.category) : '') + '</div>';
      html += '<div class="fav-headline">' + escapeHtml(it.headline || '') + '</div>';
      if (it.summary) html += '<p class="fav-summary">' + escapeHtml(it.summary) + '</p>';
      html += '<div class="actions-row">';
      if (it.sourceUrl) {
        html += '<a class="source-link" href="' + escapeHtml(it.sourceUrl) + '" target="_blank" rel="noopener">出典: ' + escapeHtml(it.sourceLabel || 'リンク') + '</a>';
      } else {
        html += '<span class="source-link"></span>';
      }
      html += '<button type="button" class="action-btn secondary" data-remove="1">♥ 解除</button>';
      html += '</div>';
      card.innerHTML = html;
      card.querySelector('[data-remove]').addEventListener('click', function () {
        toggleFavorite(
          { id: it.articleId, headline: it.headline, summary: it.summary, sourceLabel: it.sourceLabel, sourceUrl: it.sourceUrl },
          it.category,
          it.date,
          null
        );
        card.remove();
      });
      contentEl.appendChild(card);
    });
  }

  // ---------- date navigation ----------
  function populateDateSelect() {
    dateSelect.innerHTML = '';
    state.dates.forEach(function (d) {
      var opt = document.createElement('option');
      opt.value = d;
      opt.textContent = formatDateJp(d);
      dateSelect.appendChild(opt);
    });
  }

  function updateNavButtons() {
    var idx = state.dates.indexOf(state.currentDate);
    // dates[] is newest-first: prev day = older = higher index, next day = newer = lower index
    prevDayBtn.disabled = idx === -1 || idx >= state.dates.length - 1;
    nextDayBtn.disabled = idx <= 0;
    dateSelect.value = state.currentDate;
  }

  function loadDate(date) {
    state.view = 'daily';
    document.getElementById('datebar').style.display = 'flex';
    state.currentDate = date;
    contentEl.innerHTML = '<div class="empty-state">読み込み中…</div>';
    updateNavButtons();
    fetch('data/' + date + '.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        state.data = data;
        renderData(data);
      })
      .catch(function (err) {
        contentEl.innerHTML = '<div class="empty-state">データを読み込めませんでした。<br>(' + escapeHtml(err.message) + ')</div>';
      });
  }

  prevDayBtn.addEventListener('click', function () {
    var idx = state.dates.indexOf(state.currentDate);
    if (idx > -1 && idx < state.dates.length - 1) loadDate(state.dates[idx + 1]);
  });
  nextDayBtn.addEventListener('click', function () {
    var idx = state.dates.indexOf(state.currentDate);
    if (idx > 0) loadDate(state.dates[idx - 1]);
  });
  dateSelect.addEventListener('change', function () { loadDate(dateSelect.value); });

  document.getElementById('favoritesBtn').addEventListener('click', function () {
    if (state.view === 'favorites') {
      loadDate(state.currentDate);
    } else {
      state.view = 'favorites';
      document.getElementById('datebar').style.display = 'none';
      renderFavoritesView();
    }
  });

  // ---------- boot ----------
  loadFavoritesIndex().then(function () {
    return fetch('data/index.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function (idx) {
        state.dates = idx.dates || [];
        if (!state.dates.length) throw new Error('no dates');
        populateDateSelect();
        loadDate(state.dates[0]);
      });
  }).catch(function (err) {
    contentEl.innerHTML = '<div class="empty-state">ニュースデータを読み込めませんでした。<br>(' + escapeHtml(err.message) + ')</div>';
  });
})();
</script>
</body>
</html>
