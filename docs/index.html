<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIニュースBrief</title>
<meta name="theme-color" content="#2260d6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIニュース">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --sub: #6b6b70;
    --card-bg: #f6f6f8;
    --border: #e2e2e6;
    --accent: #2260d6;
    --accent-fg: #ffffff;
    --star: #d97706;
    --heart: #c1394a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #f0f0f2;
      --sub: #a3a3aa;
      --card-bg: #1e1e21;
      --border: #303034;
      --accent: #7aa7ff;
      --accent-fg: #0b1220;
      --star: #f5a524;
      --heart: #ff8a9a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 60px;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    line-height: 1.8;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; }
  main {
    max-width: 640px;
    margin: 0 auto;
  }
  header.top {
    max-width: 640px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  header.top h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: 0.02em;
    text-align: center;
  }
  #favoritesBtn {
    position: absolute;
    left: 0;
    top: -4px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--sub);
    cursor: pointer;
    padding: 6px;
  }
  .datebar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .datebar button {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .datebar button:disabled { opacity: 0.35; cursor: default; }
  .datebar select {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.95rem;
  }
  h2 {
    font-size: 1.15rem;
    margin: 32px 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  summary {
    padding: 14px 16px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: "▾";
    margin-left: auto;
    color: var(--sub);
    font-weight: normal;
    flex-shrink: 0;
  }
  details[open] > summary::after { content: "▴"; }
  details[open] > summary {
    border-bottom: 1px solid var(--border);
  }
  .star { color: var(--star); }
  .fav-btn {
    background: none;
    border: none;
    font-size: 1.15rem;
    line-height: 1;
    padding: 0 2px 0 0;
    cursor: pointer;
    color: var(--heart);
    flex-shrink: 0;
  }
  .fav-card { padding: 14px 16px; }
  .fav-meta { font-size: 0.78rem; color: var(--sub); margin-bottom: 4px; }
  .fav-headline { font-weight: 600; margin-bottom: 6px; }
  .fav-summary { font-size: 0.9rem; margin: 0 0 8px; }
  .body { padding: 14px 16px 16px; font-size: 0.95rem; }
  .body p { margin: 0 0 10px; }
  .actions-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .actions-row a.source-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .actions-row a.source-link:hover { text-decoration: underline; }
  .action-btn {
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
  }
  footer.page-footer {
    max-width: 640px;
    margin: 40px auto 0;
    text-align: center;
    color: var(--sub);
    font-size: 0.8rem;
  }
  .empty-state {
    text-align: center;
    color: var(--sub);
    padding: 60px 20px;
  }

  /* お気に入り: 検索 */
  .fav-search {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }
  .fav-search input {
    flex: 1;
    min-width: 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .fav-count {
    font-size: 0.8rem;
    color: var(--sub);
    white-space: nowrap;
  }

  /* お気に入り: メモ */
  .note-wrap { margin-top: 10px; }
  .note-label {
    font-size: 0.78rem;
    color: var(--sub);
    display: block;
    margin-bottom: 4px;
  }
  .note-input {
    width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    padding: 9px 11px;
    font-size: 0.9rem;
    font-family: inherit;
    line-height: 1.7;
    resize: vertical;
    min-height: 42px;
  }
  .note-status {
    font-size: 0.75rem;
    color: var(--sub);
    margin-top: 4px;
    min-height: 1.2em;
  }
  mark {
    background: var(--accent);
    color: var(--accent-fg);
    border-radius: 3px;
    padding: 0 2px;
  }
</style>
</head>
<body>
<header class="top">
  <button id="favoritesBtn" aria-label="お気に入り一覧">★</button>
  <h1>AIニュースBrief</h1>
</header>

<div class="datebar" id="datebar">
  <button id="prevDay" aria-label="前の日">◀</button>
  <select id="dateSelect"></select>
  <button id="nextDay" aria-label="次の日">▶</button>
</div>

<main id="content">
  <div class="empty-state">読み込み中…</div>
</main>

<footer class="page-footer">AIニュースBrief — araiさん専属ダイジェスト</footer>

<script>
(function () {
  "use strict";

  var WORKER_BASE = 'https://ai-news-brief-chat.ainewsbrief.workers.dev';

  var state = {
    dates: [],
    currentDate: null,
    data: null,
    favorites: {},
    favItems: [],
    favQuery: '',
    view: 'daily'
  };

  var contentEl = document.getElementById('content');
  var dateSelect = document.getElementById('dateSelect');
  var prevDayBtn = document.getElementById('prevDay');
  var nextDayBtn = document.getElementById('nextDay');

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatDateJp(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if (!m) return d;
    return m[1] + '年' + parseInt(m[2], 10) + '月' + parseInt(m[3], 10) + '日';
  }

  // ---------- お気に入り ----------
  function loadFavoritesIndex() {
    return fetch('data/favorites.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('status ' + res.status); return res.json(); })
      .then(function (data) {
        var map = {};
        (data.favorites || []).forEach(function (it) { map[it.articleId] = it; });
        state.favorites = map;
      })
      .catch(function () { state.favorites = {}; });
  }

  function toggleFavorite(article, category, date, btnEl) {
    var willAdd = !state.favorites[article.id];
    var record = {
      date: date || state.currentDate,
      articleId: article.id,
      headline: article.headline,
      summary: article.summary,
      category: category,
      sourceLabel: article.sourceLabel,
      sourceUrl: article.sourceUrl,
      favoritedAt: new Date().toISOString()
    };
    if (willAdd) state.favorites[article.id] = record;
    else delete state.favorites[article.id];
    if (btnEl) btnEl.textContent = willAdd ? '♥' : '♡';

    fetch(WORKER_BASE + '/api/favorite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: willAdd ? 'add' : 'remove',
        date: record.date,
        articleId: record.articleId,
        headline: record.headline,
        summary: record.summary,
        category: record.category,
        sourceLabel: record.sourceLabel,
        sourceUrl: record.sourceUrl
      })
    }).catch(function (e) { console.warn('favorite sync failed', e); });
  }

  // ---------- rendering ----------
  function renderArticle(a, category) {
    var det = document.createElement('details');
    det.className = 'card';
    det.id = 'article-' + a.id;

    var isFav = !!state.favorites[a.id];
    var sum = document.createElement('summary');
    sum.innerHTML = '<button type="button" class="fav-btn" aria-label="お気に入り">' + (isFav ? '♥' : '♡') + '</button>' +
      (a.star ? '<span class="star">★</span>' : '') + escapeHtml(a.headline);
    det.appendChild(sum);

    sum.querySelector('.fav-btn').addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      toggleFavorite(a, category, state.currentDate, e.currentTarget);
    });

    var body = document.createElement('div');
    body.className = 'body';
    var html = '<p>' + escapeHtml(a.detail || a.summary) + '</p>';
    html += '<div class="actions-row">';
    if (a.sourceUrl) {
      html += '<a class="source-link" href="' + escapeHtml(a.sourceUrl) + '" target="_blank" rel="noopener">出典: ' + escapeHtml(a.sourceLabel || 'リンク') + '</a>';
    }
    html += '</div>';
    body.innerHTML = html;
    det.appendChild(body);

    return det;
  }

  function renderData(data) {
    contentEl.innerHTML = '';
    if (!data || !data.sections || !data.sections.length) {
      contentEl.innerHTML = '<div class="empty-state">この日のニュースはありません。</div>';
      return;
    }
    data.sections.forEach(function (section) {
      var h2 = document.createElement('h2');
      h2.textContent = section.title;
      contentEl.appendChild(h2);
      (section.articles || []).forEach(function (a) {
        contentEl.appendChild(renderArticle(a, section.title));
      });
    });
  }

  // ---------- お気に入り一覧ビュー ----------
  var FAVORITES_RETENTION_DAYS = 365;

  function renderFavoritesView() {
    contentEl.innerHTML = '<div class="empty-state">読み込み中…</div>';
    fetch('data/favorites.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var items = Array.isArray(data.favorites) ? data.favorites : [];
        var cutoff = Date.now() - FAVORITES_RETENTION_DAYS * 24 * 60 * 60 * 1000;
        state.favItems = items.filter(function (it) {
          var t = Date.parse(it.favoritedAt || it.date);
          return isNaN(t) ? true : t >= cutoff;
        });
        buildFavoritesUI();
      })
      .catch(function (err) {
        contentEl.innerHTML = '<div class="empty-state">お気に入りを読み込めませんでした。<br>(' + escapeHtml(err.message) + ')</div>';
      });
  }

  function escapeRegExp(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function searchTerms() {
    return (state.favQuery || '').trim().split(/[\s　]+/).filter(Boolean);
  }

  function matchesQuery(it, terms) {
    if (!terms.length) return true;
    var haystack = [it.headline, it.summary, it.note, it.category, it.sourceLabel]
      .filter(Boolean).join(' ').toLowerCase();
    return terms.every(function (t) { return haystack.indexOf(t.toLowerCase()) !== -1; });
  }

  function highlight(text, terms) {
    var out = escapeHtml(text || '');
    terms.forEach(function (t) {
      out = out.replace(new RegExp(escapeRegExp(escapeHtml(t)), 'gi'), function (m) {
        return '<mark>' + m + '</mark>';
      });
    });
    return out;
  }

  function buildFavoritesUI() {
    contentEl.innerHTML = '';

    var h2 = document.createElement('h2');
    h2.textContent = '★ お気に入り（直近1年）';
    contentEl.appendChild(h2);

    if (!state.favItems.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'お気に入りはまだありません。記事の♡をタップして追加できます。';
      contentEl.appendChild(empty);
      return;
    }

    var searchBar = document.createElement('div');
    searchBar.className = 'fav-search';
    searchBar.innerHTML =
      '<input type="search" id="favSearch" placeholder="見出し・要約・メモから検索" ' +
      'autocapitalize="off" autocorrect="off" spellcheck="false">' +
      '<span class="fav-count" id="favCount"></span>';
    contentEl.appendChild(searchBar);

    var listEl = document.createElement('div');
    contentEl.appendChild(listEl);

    var input = searchBar.querySelector('#favSearch');
    input.value = state.favQuery || '';
    input.addEventListener('input', function () {
      state.favQuery = input.value;
      renderFavoritesList(listEl);
    });

    renderFavoritesList(listEl);
  }

  function renderFavoritesList(listEl) {
    var terms = searchTerms();
    var items = state.favItems.filter(function (it) { return matchesQuery(it, terms); });

    var countEl = document.getElementById('favCount');
    if (countEl) {
      countEl.textContent = terms.length
        ? items.length + ' / ' + state.favItems.length + '件'
        : state.favItems.length + '件';
    }

    listEl.innerHTML = '';
    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = '該当するお気に入りはありません。';
      listEl.appendChild(empty);
      return;
    }

    items.forEach(function (it) {
      listEl.appendChild(renderFavoriteCard(it, terms));
    });
  }

  function renderFavoriteCard(it, terms) {
    var card = document.createElement('div');
    card.className = 'card fav-card';

    var html = '<div class="fav-meta">' + escapeHtml(formatDateJp(it.date)) +
      (it.category ? ' ・ ' + escapeHtml(it.category) : '') + '</div>';
    html += '<div class="fav-headline">' + highlight(it.headline, terms) + '</div>';
    if (it.summary) html += '<p class="fav-summary">' + highlight(it.summary, terms) + '</p>';

    html += '<div class="note-wrap">';
    html += '<label class="note-label">メモ</label>';
    html += '<textarea class="note-input" rows="2" placeholder="調べたこと・気づきをメモ">' +
      escapeHtml(it.note || '') + '</textarea>';
    html += '<div class="note-status"></div>';
    html += '</div>';

    html += '<div class="actions-row">';
    if (it.sourceUrl) {
      html += '<a class="source-link" href="' + escapeHtml(it.sourceUrl) +
        '" target="_blank" rel="noopener">出典: ' + escapeHtml(it.sourceLabel || 'リンク') + '</a>';
    } else {
      html += '<span class="source-link"></span>';
    }
    html += '<button type="button" class="action-btn" data-remove="1">♥ 解除</button>';
    html += '</div>';
    card.innerHTML = html;

    var noteInput = card.querySelector('.note-input');
    var noteStatus = card.querySelector('.note-status');
    var saveTimer = null;
    var isComposing = false;

    function scheduleSave() {
      if (isComposing) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { saveNote(it, noteInput.value, noteStatus); }, 900);
    }
    noteInput.addEventListener('compositionstart', function () { isComposing = true; });
    noteInput.addEventListener('compositionend', function () { isComposing = false; scheduleSave(); });
    noteInput.addEventListener('input', scheduleSave);
    noteInput.addEventListener('blur', function () {
      clearTimeout(saveTimer);
      if (noteInput.value !== (it.note || '')) saveNote(it, noteInput.value, noteStatus);
    });

    card.querySelector('[data-remove]').addEventListener('click', function () {
      toggleFavorite(
        { id: it.articleId, headline: it.headline, summary: it.summary, sourceLabel: it.sourceLabel, sourceUrl: it.sourceUrl },
        it.category,
        it.date,
        null
      );
      state.favItems = state.favItems.filter(function (x) { return x.articleId !== it.articleId; });
      card.remove();
      var countEl = document.getElementById('favCount');
      if (countEl) countEl.textContent = state.favItems.length + '件';
    });

    return card;
  }

  function saveNote(it, note, statusEl) {
    if (note === (it.note || '')) return;
    it.note = note;
    if (state.favorites[it.articleId]) state.favorites[it.articleId].note = note;
    statusEl.textContent = '保存中…';

    fetch(WORKER_BASE + '/api/favorite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'note',
        date: it.date,
        articleId: it.articleId,
        note: note,
        headline: it.headline,
        summary: it.summary,
        category: it.category,
        sourceLabel: it.sourceLabel,
        sourceUrl: it.sourceUrl
      })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        statusEl.textContent = '保存しました';
        setTimeout(function () { statusEl.textContent = ''; }, 2000);
      })
      .catch(function () {
        statusEl.textContent = '保存できませんでした（通信状況を確認してください）';
      });
  }

  // ---------- date navigation ----------
  function populateDateSelect() {
    dateSelect.innerHTML = '';
    state.dates.forEach(function (d) {
      var opt = document.createElement('option');
      opt.value = d;
      opt.textContent = formatDateJp(d);
      dateSelect.appendChild(opt);
    });
  }

  function updateNavButtons() {
    var idx = state.dates.indexOf(state.currentDate);
    // dates[] is newest-first: prev day = older = higher index, next day = newer = lower index
    prevDayBtn.disabled = idx === -1 || idx >= state.dates.length - 1;
    nextDayBtn.disabled = idx <= 0;
    dateSelect.value = state.currentDate;
  }

  function loadDate(date) {
    state.view = 'daily';
    document.getElementById('datebar').style.display = 'flex';
    state.currentDate = date;
    contentEl.innerHTML = '<div class="empty-state">読み込み中…</div>';
    updateNavButtons();
    fetch('data/' + date + '.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        state.data = data;
        renderData(data);
      })
      .catch(function (err) {
        contentEl.innerHTML = '<div class="empty-state">データを読み込めませんでした。<br>(' + escapeHtml(err.message) + ')</div>';
      });
  }

  prevDayBtn.addEventListener('click', function () {
    var idx = state.dates.indexOf(state.currentDate);
    if (idx > -1 && idx < state.dates.length - 1) loadDate(state.dates[idx + 1]);
  });
  nextDayBtn.addEventListener('click', function () {
    var idx = state.dates.indexOf(state.currentDate);
    if (idx > 0) loadDate(state.dates[idx - 1]);
  });
  dateSelect.addEventListener('change', function () { loadDate(dateSelect.value); });

  document.getElementById('favoritesBtn').addEventListener('click', function () {
    if (state.view === 'favorites') {
      loadDate(state.currentDate);
    } else {
      state.view = 'favorites';
      document.getElementById('datebar').style.display = 'none';
      renderFavoritesView();
    }
  });

  // ---------- boot ----------
  loadFavoritesIndex().then(function () {
    return fetch('data/index.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function (idx) {
        state.dates = idx.dates || [];
        if (!state.dates.length) throw new Error('no dates');
        populateDateSelect();
        loadDate(state.dates[0]);
      });
  }).catch(function (err) {
    contentEl.innerHTML = '<div class="empty-state">ニュースデータを読み込めませんでした。<br>(' + escapeHtml(err.message) + ')</div>';
  });
})();
</script>
</body>
</html>
