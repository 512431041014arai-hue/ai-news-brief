<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIニュースBrief</title>
<meta name="theme-color" content="#2260d6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIニュース">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --sub: #6b6b70;
    --card-bg: #f6f6f8;
    --border: #e2e2e6;
    --accent: #2260d6;
    --accent-fg: #ffffff;
    --star: #d97706;
    --danger: #c1394a;
    --bubble-user: #2260d6;
    --bubble-user-fg: #ffffff;
    --bubble-ai: #e9e9ee;
    --bubble-ai-fg: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #f0f0f2;
      --sub: #a3a3aa;
      --card-bg: #1e1e21;
      --border: #303034;
      --accent: #7aa7ff;
      --accent-fg: #0b1220;
      --star: #f5a524;
      --danger: #ff8a9a;
      --bubble-user: #3a6ff0;
      --bubble-user-fg: #ffffff;
      --bubble-ai: #2a2a2e;
      --bubble-ai-fg: #f0f0f2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 60px;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    line-height: 1.8;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; }
  main, #app-header {
    max-width: 640px;
    margin: 0 auto;
  }
  header.top {
    max-width: 640px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  header.top h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: 0.02em;
    text-align: center;
  }
  #settingsBtn {
    position: absolute;
    right: 0;
    top: -4px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--sub);
    cursor: pointer;
    padding: 6px;
  }
  .datebar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .datebar button {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .datebar button:disabled { opacity: 0.35; cursor: default; }
  .datebar select {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.95rem;
  }
  h2 {
    font-size: 1.15rem;
    margin: 32px 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
  }
  details.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  summary {
    padding: 14px 16px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: "▾";
    margin-left: auto;
    color: var(--sub);
    font-weight: normal;
    flex-shrink: 0;
  }
  details[open] > summary::after { content: "▴"; }
  details[open] > summary {
    border-bottom: 1px solid var(--border);
  }
  .star { color: var(--star); }
  .body { padding: 14px 16px 16px; font-size: 0.95rem; }
  .body p { margin: 0 0 10px; }
  .career {
    background: rgba(34, 96, 214, 0.08);
    border-left: 3px solid var(--accent);
    padding: 8px 12px;
    border-radius: 6px;
    margin: 0 0 12px;
    font-size: 0.9rem;
  }
  .career b { color: var(--accent); }
  .actions-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .actions-row a { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
  .actions-row a:hover { text-decoration: underline; }
  .chat-btn {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
  }
  footer.page-footer {
    max-width: 640px;
    margin: 40px auto 0;
    text-align: center;
    color: var(--sub);
    font-size: 0.8rem;
  }
  .empty-state {
    text-align: center;
    color: var(--sub);
    padding: 60px 20px;
  }

  /* overlay / bottom sheet */
  .overlay {
    position: fixed;
    left: 0;
    right: 0;
    top: var(--vv-top, 0px);
    height: var(--vv-height, 100vh);
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: flex-end;
    z-index: 50;
  }
  .overlay.hidden { display: none; }
  .sheet {
    background: var(--bg);
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    border-radius: 16px 16px 0 0;
    max-height: calc(var(--vv-height, 100vh) * 0.88);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
  }
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-title { font-weight: 700; font-size: 1rem; padding-right: 12px; }
  .sheet-header button.close {
    background: none;
    border: none;
    color: var(--sub);
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* chat */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 160px;
  }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; font-size: 0.92rem; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: var(--bubble-user-fg); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--bubble-ai); color: var(--bubble-ai-fg); border-bottom-left-radius: 4px; }
  .msg.system-note { align-self: center; color: var(--sub); font-size: 0.8rem; background: none; padding: 4px; }
  .msg.pending { opacity: 0.6; }
  .chat-inputbar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
  }
  .chat-inputbar textarea {
    flex: 1;
    resize: none;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    padding: 10px 12px;
    font-size: 0.95rem;
    min-height: 42px;
    max-height: 120px;
    font-family: inherit;
  }
  .chat-inputbar button {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-weight: 600;
    cursor: pointer;
  }
  .chat-inputbar button:disabled { opacity: 0.5; }
  .chat-actions {
    display: flex;
    gap: 8px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .chat-actions button {
    flex: 1;
    min-width: 130px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    padding: 9px 10px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .chat-actions button#chatNotInterested { color: var(--danger); }
  .chat-hint {
    padding: 16px;
    color: var(--sub);
    font-size: 0.88rem;
    text-align: center;
  }

  /* settings */
  .settings-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .settings-body label { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--sub); }
  .settings-body input {
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  .settings-body .save-btn {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .settings-note { font-size: 0.78rem; color: var(--sub); line-height: 1.6; }
</style>
</head>
<body>
<header class="top">
  <button id="settingsBtn" aria-label="設定">⚙️</button>
  <h1>AIニュースBrief</h1>
</header>

<div class="datebar">
  <button id="prevDay" aria-label="前の日">◀</button>
  <select id="dateSelect"></select>
  <button id="nextDay" aria-label="次の日">▶</button>
</div>

<main id="content">
  <div class="empty-state">読み込み中…</div>
</main>

<footer class="page-footer">AIニュースBrief — araiさん専属ダイジェスト</footer>

<!-- チャットシート -->
<div id="chatOverlay" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title" id="chatArticleTitle"></div>
      <button class="close" id="chatClose" aria-label="閉じる">✕</button>
    </div>
    <div id="chatBody">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-inputbar">
        <textarea id="chatInput" rows="1" placeholder="この記事について質問してみる…"></textarea>
        <button id="chatSend">送信</button>
      </div>
      <div class="chat-actions">
        <button id="chatSaveObsidian">📓 Obsidianに保存</button>
        <button id="chatNotInterested">🚫 もう出さないで</button>
      </div>
    </div>
  </div>
</div>

<!-- 設定シート -->
<div id="settingsOverlay" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title">設定</div>
      <button class="close" id="settingsClose" aria-label="閉じる">✕</button>
    </div>
    <div class="settings-body">
      <label>チャットAPIのURL
        <input id="cfgApiUrl" placeholder="https://xxxx.workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <label>Obsidian Vault名
        <input id="cfgVault" placeholder="例: Obsidian" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <label>保存先フォルダ（Vault内のパス）
        <input id="cfgFolder" placeholder="99_情報ソース/AIニュースBrief_チャット" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <button class="save-btn" id="settingsSave">保存</button>
      <div class="settings-note">
        チャットAPIのURLはCloudflare Workerのデプロイ後に発行されるURLを入力してください（SETUP.md参照）。Vault名はObsidianアプリに表示されている名前と一致させてください。設定はこの端末のブラウザにのみ保存されます。
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var state = {
    dates: [],
    currentDate: null,
    data: null,
    chat: { articleId: null, article: null, history: [] }
  };

  var contentEl = document.getElementById('content');
  var dateSelect = document.getElementById('dateSelect');
  var prevDayBtn = document.getElementById('prevDay');
  var nextDayBtn = document.getElementById('nextDay');

  // iOSのソフトウェアキーボード表示時、position:fixedの要素がキーボードの下に
  // 隠れて入力欄が届かなくなる問題への対策。visualViewportの高さ・オフセットを
  // CSSカスタムプロパティに反映し、オーバーレイの高さをそれに追従させる。
  function syncViewportVars() {
    var vv = window.visualViewport;
    var height = vv ? vv.height : window.innerHeight;
    var top = vv ? vv.offsetTop : 0;
    document.documentElement.style.setProperty('--vv-height', height + 'px');
    document.documentElement.style.setProperty('--vv-top', top + 'px');
  }
  syncViewportVars();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewportVars);
    window.visualViewport.addEventListener('scroll', syncViewportVars);
  }
  window.addEventListener('orientationchange', function () {
    setTimeout(syncViewportVars, 250);
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatDateJp(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if (!m) return d;
    return m[1] + '年' + parseInt(m[2], 10) + '月' + parseInt(m[3], 10) + '日';
  }

  // ---------- settings ----------
  var SETTINGS_KEY = 'ainewsbrief.settings.v1';
  function loadSettings() {
    try {
      return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
    } catch (e) { return {}; }
  }
  function saveSettings(s) {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
  }
  function getApiUrl() {
    var s = loadSettings();
    return (s.apiUrl || '').replace(/\/+$/, '');
  }

  var settingsOverlay = document.getElementById('settingsOverlay');
  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('settingsClose').addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', function (e) { if (e.target === settingsOverlay) closeSettings(); });
  document.getElementById('settingsSave').addEventListener('click', function () {
    var s = {
      apiUrl: document.getElementById('cfgApiUrl').value.trim(),
      vault: document.getElementById('cfgVault').value.trim(),
      folder: document.getElementById('cfgFolder').value.trim()
    };
    saveSettings(s);
    closeSettings();
  });

  function openSettings() {
    var s = loadSettings();
    document.getElementById('cfgApiUrl').value = s.apiUrl || '';
    document.getElementById('cfgVault').value = s.vault || '';
    document.getElementById('cfgFolder').value = s.folder || '99_情報ソース/AIニュースBrief_チャット';
    settingsOverlay.classList.remove('hidden');
  }
  function closeSettings() { settingsOverlay.classList.add('hidden'); }

  // ---------- rendering ----------
  function renderArticle(a) {
    var det = document.createElement('details');
    det.className = 'card';
    det.id = 'article-' + a.id;

    var sum = document.createElement('summary');
    sum.innerHTML = (a.star ? '<span class="star">★</span>' : '') + escapeHtml(a.headline);
    det.appendChild(sum);

    var body = document.createElement('div');
    body.className = 'body';
    var html = '<p>' + escapeHtml(a.detail || a.summary) + '</p>';
    if (a.careerNote) {
      html += '<div class="career"><b>転職視点：</b>' + escapeHtml(a.careerNote) + '</div>';
    }
    html += '<div class="actions-row">';
    if (a.sourceUrl) {
      html += '<a href="' + escapeHtml(a.sourceUrl) + '" target="_blank" rel="noopener">出典: ' + escapeHtml(a.sourceLabel || 'リンク') + '</a>';
    } else {
      html += '<span></span>';
    }
    html += '<button class="chat-btn" data-id="' + escapeHtml(a.id) + '">💬 AIとチャットする</button>';
    html += '</div>';
    body.innerHTML = html;
    det.appendChild(body);

    body.querySelector('.chat-btn').addEventListener('click', function () {
      openChat(a);
    });

    return det;
  }

  function renderData(data) {
    contentEl.innerHTML = '';
    if (!data || !data.sections || !data.sections.length) {
      contentEl.innerHTML = '<div class="empty-state">この日のニュースはありません。</div>';
      return;
    }
    data.sections.forEach(function (section) {
      var h2 = document.createElement('h2');
      h2.textContent = section.title;
      contentEl.appendChild(h2);
      (section.articles || []).forEach(function (a) {
        contentEl.appendChild(renderArticle(a));
      });
    });
  }

  // ---------- date navigation ----------
  function populateDateSelect() {
    dateSelect.innerHTML = '';
    state.dates.forEach(function (d) {
      var opt = document.createElement('option');
      opt.value = d;
      opt.textContent = formatDateJp(d);
      dateSelect.appendChild(opt);
    });
  }

  function updateNavButtons() {
    var idx = state.dates.indexOf(state.currentDate);
    // dates[] is newest-first: prev day = older = higher index, next day = newer = lower index
    prevDayBtn.disabled = idx === -1 || idx >= state.dates.length - 1;
    nextDayBtn.disabled = idx <= 0;
    dateSelect.value = state.currentDate;
  }

  function loadDate(date) {
    state.currentDate = date;
    contentEl.innerHTML = '<div class="empty-state">読み込み中…</div>';
    updateNavButtons();
    fetch('data/' + date + '.json', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        state.data = data;
        renderData(data);
      })
      .catch(function (err) {
        contentEl.innerHTML = '<div class="empty-state">データを読み込めませんでした。<br>(' + escapeHtml(err.message) + ')</div>';
      });
  }

  prevDayBtn.addEventListener('click', function () {
    var idx = state.dates.indexOf(state.currentDate);
    if (idx > -1 && idx < state.dates.length - 1) loadDate(state.dates[idx + 1]);
  });
  nextDayBtn.addEventListener('click', function () {
    var idx = state.dates.indexOf(state.currentDate);
    if (idx > 0) loadDate(state.dates[idx - 1]);
  });
  dateSelect.addEventListener('change', function () { loadDate(dateSelect.value); });

  // ---------- chat ----------
  var chatOverlay = document.getElementById('chatOverlay');
  var chatMessages = document.getElementById('chatMessages');
  var chatInput = document.getElementById('chatInput');
  var chatSendBtn = document.getElementById('chatSend');
  var chatArticleTitle = document.getElementById('chatArticleTitle');

  document.getElementById('chatClose').addEventListener('click', closeChat);
  chatOverlay.addEventListener('click', function (e) { if (e.target === chatOverlay) closeChat(); });

  // キーボード表示アニメーション後にビューポート変数と最下部スクロールを再計算する
  chatInput.addEventListener('focus', function () {
    setTimeout(function () {
      syncViewportVars();
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }, 300);
  });

  function openChat(article) {
    state.chat = { articleId: article.id, article: article, history: [] };
    chatArticleTitle.textContent = article.headline;
    renderChatMessages();
    var apiUrl = getApiUrl();
    if (!apiUrl) {
      chatMessages.innerHTML = '<div class="chat-hint">チャット機能を使うには、右上の⚙️設定でチャットAPIのURLを入力してください（Cloudflare Workerのデプロイが必要です。詳しくはSETUP.mdを参照）。</div>';
    }
    chatOverlay.classList.remove('hidden');
    chatInput.focus();
  }
  function closeChat() { chatOverlay.classList.add('hidden'); }

  function renderChatMessages() {
    chatMessages.innerHTML = '';
    state.chat.history.forEach(function (m) {
      var div = document.createElement('div');
      div.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant') + (m.pending ? ' pending' : '');
      div.textContent = m.content;
      chatMessages.appendChild(div);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function setSending(sending) {
    chatSendBtn.disabled = sending;
    chatInput.disabled = sending;
  }

  function sendChatMessage() {
    var text = chatInput.value.trim();
    if (!text) return;
    var apiUrl = getApiUrl();
    if (!apiUrl) { openSettings(); return; }

    state.chat.history.push({ role: 'user', content: text });
    chatInput.value = '';
    renderChatMessages();
    setSending(true);

    var pendingMsg = { role: 'assistant', content: '…', pending: true };
    state.chat.history.push(pendingMsg);
    renderChatMessages();

    fetch(apiUrl + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: state.currentDate,
        articleId: state.chat.articleId,
        article: {
          headline: state.chat.article.headline,
          summary: state.chat.article.summary,
          detail: state.chat.article.detail,
          sourceUrl: state.chat.article.sourceUrl
        },
        history: state.chat.history.slice(0, -2),
        message: text
      })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        pendingMsg.content = data.reply || '（応答が空でした）';
        pendingMsg.pending = false;
      })
      .catch(function (err) {
        pendingMsg.content = '応答を取得できませんでした（' + escapeHtml(err.message) + '）。設定のAPI URLを確認してください。';
        pendingMsg.pending = false;
      })
      .finally(function () {
        setSending(false);
        renderChatMessages();
      });
  }

  var isComposing = false;
  chatInput.addEventListener('compositionstart', function () { isComposing = true; });
  chatInput.addEventListener('compositionend', function () { isComposing = false; });

  chatSendBtn.addEventListener('click', sendChatMessage);
  chatInput.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.shiftKey) return;
    // 日本語入力などIMEの変換確定Enterでは送信しない
    if (isComposing || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    sendChatMessage();
  });

  function persistChatLog(extra) {
    var apiUrl = getApiUrl();
    if (!apiUrl || !state.chat.history.length) return Promise.resolve();
    return fetch(apiUrl + '/api/save-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({
        date: state.currentDate,
        articleId: state.chat.articleId,
        article: state.chat.article,
        history: state.chat.history.filter(function (m) { return !m.pending; })
      }, extra || {}))
    }).catch(function (e) { console.warn('save-chat failed', e); });
  }

  function sanitizeFilename(s) {
    return String(s).replace(/[\\/:*?"<>|#^\[\]]/g, '').trim().slice(0, 60);
  }

  document.getElementById('chatSaveObsidian').addEventListener('click', function () {
    var s = loadSettings();
    if (!s.vault) { alert('先に設定でObsidianのVault名を入力してください。'); openSettings(); return; }
    if (!state.chat.history.length) { alert('保存するチャット履歴がありません。'); return; }

    var folder = (s.folder || '99_情報ソース/AIニュースBrief_チャット').replace(/\/+$/, '');
    var a = state.chat.article;
    var filename = folder + '/' + state.currentDate + '_' + sanitizeFilename(a.headline) + '.md';

    var lines = [];
    lines.push('---');
    lines.push('created: ' + state.currentDate);
    lines.push('tags:');
    lines.push(' - AIニュースBrief/チャット');
    lines.push('---');
    lines.push('');
    lines.push('# ' + a.headline);
    lines.push('');
    lines.push('> ' + (a.summary || ''));
    lines.push('');
    if (a.sourceUrl) lines.push('出典: [' + (a.sourceLabel || 'リンク') + '](' + a.sourceUrl + ')');
    lines.push('');
    lines.push('## チャット履歴');
    lines.push('');
    state.chat.history.forEach(function (m) {
      if (m.pending) return;
      lines.push('**' + (m.role === 'user' ? 'arai' : 'AI') + ':** ' + m.content);
      lines.push('');
    });
    var content = lines.join('\n');

    var uri = 'obsidian://new?vault=' + encodeURIComponent(s.vault) +
      '&file=' + encodeURIComponent(filename) +
      '&content=' + encodeURIComponent(content);

    persistChatLog({ savedToObsidian: true });
    window.location.href = uri;
  });

  document.getElementById('chatNotInterested').addEventListener('click', function () {
    if (!confirm('この記事のテーマは今後の見出し選定から除外するよう記録します。よろしいですか？')) return;
    state.chat.history.push({ role: 'user', content: '[フィードバック] このテーマはもう取り上げないでください。' });
    renderChatMessages();
    persistChatLog({ feedback: 'exclude' }).then(function () {
      alert('記録しました。明日以降の選定に反映されます（バックエンド未設定の場合は反映されません）。');
    });
  });

  // ---------- boot ----------
  fetch('data/index.json', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('status ' + res.status);
      return res.json();
    })
    .then(function (idx) {
      state.dates = idx.dates || [];
      if (!state.dates.length) throw new Error('no dates');
      populateDateSelect();
      loadDate(state.dates[0]);
    })
    .catch(function (err) {
      contentEl.innerHTML = '<div class="empty-state">ニュースデータを読み込めませんでした。<br>(' + escapeHtml(err.message) + ')</div>';
    });
})();
</script>
</body>
</html>
